# Offline test suite on every push and pull request. No model calls, no secrets.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt && pip install -e . --no-deps
      - name: Test
        run: python -m pytest -q
      - name: MCP entry point
        run: python -c "import attest.mcp_server as m; m.build_server()"
