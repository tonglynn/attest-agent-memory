<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1460" viewBox="0 0 1200 1460" role="img" aria-labelledby="title desc"><title id="title">Attest 默认 MCP 核心机制</title><desc id="desc">证据采集与验证、三态网关、作用域召回、任务反馈和独立人工治理。实验扩展单独标注。</desc><defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9dbdff"/></marker><marker id="yes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dc9b0"/></marker><marker id="hold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b65e"/></marker><marker id="no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef9b99"/></marker></defs><g font-family="Segoe UI, Arial, Microsoft YaHei, sans-serif"><rect width="1200" height="1460" rx="14" fill="#111b2b"/><text x="40" y="53" font-size="34" fill="#edf3ff" font-weight="700">Attest 核心机制</text><text x="40" y="89" font-size="21" fill="#afc0d7" font-weight="400">默认 MCP 路径：以证据准入，以状态控制召回</text><rect x="40" y="130" width="340" height="175" rx="10" fill="#18263a" stroke="#3b4d65" stroke-width="1.5" /><text x="60" y="167" font-size="25" fill="#edf3ff" font-weight="650">采集来源</text><text x="60" y="202" font-size="22" fill="#afc0d7" font-weight="400">原始评审意见</text><text x="60" y="233" font-size="22" fill="#afc0d7" font-weight="400">服务端计算 Git diff</text><rect x="430" y="130" width="340" height="175" rx="10" fill="#18263a" stroke="#3b4d65" stroke-width="1.5" /><text x="450" y="167" font-size="25" fill="#edf3ff" font-weight="650">执行验证</text><text x="450" y="202" font-size="22" fill="#afc0d7" font-weight="400">配置者指定验证命令</text><text x="450" y="233" font-size="22" fill="#afc0d7" font-weight="400">失败 → 默认路径不学习</text><rect x="820" y="130" width="340" height="175" rx="10" fill="#18263a" stroke="#3b4d65" stroke-width="1.5" /><text x="840" y="167" font-size="25" fill="#edf3ff" font-weight="650">提出候选经验</text><text x="840" y="202" font-size="22" fill="#afc0d7" font-weight="400">最多 3 条；评审原文</text><text x="840" y="233" font-size="22" fill="#afc0d7" font-weight="400">+ 实际新增代码行</text><path d="M382 217 H425" fill="none" stroke="#9dbdff" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><path d="M772 217 H815" fill="none" stroke="#9dbdff" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><path d="M990 306 V347" fill="none" stroke="#9dbdff" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><rect x="40" y="350" width="1120" height="175" rx="10" fill="#18263a" stroke="#3b4d65" stroke-width="1.5" /><text x="60" y="387" font-size="28" fill="#edf3ff" font-weight="650">确定性证据网关</text><text x="62" y="437" font-size="24" fill="#9dbdff" font-weight="600">反证</text><text x="62" y="477" font-size="21" fill="#afc0d7" font-weight="400">违背团队代码检查</text><text x="430" y="437" font-size="24" fill="#9dbdff" font-weight="600">硬证据</text><text x="430" y="477" font-size="21" fill="#afc0d7" font-weight="400">已登记政策 / 支持性代码检查</text><text x="820" y="437" font-size="24" fill="#9dbdff" font-weight="600">软证据</text><text x="820" y="477" font-size="21" fill="#afc0d7" font-weight="400">可信评审措辞（单独不足）</text><path d="M600 526 V554 H210 V585" fill="none" stroke="#9dbdff" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><path d="M600 554 V585" fill="none" stroke="#9dbdff" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><path d="M600 554 H990 V585" fill="none" stroke="#9dbdff" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><rect x="40" y="590" width="340" height="150" rx="10" fill="#18352f" stroke="#7dc9b0" stroke-width="1.5" /><text x="60" y="627" font-size="24" fill="#edf3ff" font-weight="650">批准 · approved</text><text x="60" y="662" font-size="21" fill="#afc0d7" font-weight="400">无反证 + 硬证据</text><text x="60" y="693" font-size="21" fill="#afc0d7" font-weight="400">可成为规则</text><rect x="430" y="590" width="340" height="150" rx="10" fill="#372f1e" stroke="#e2b65e" stroke-width="1.5" /><text x="450" y="627" font-size="23" fill="#edf3ff" font-weight="650">待人工 · uncertain</text><text x="450" y="662" font-size="20" fill="#afc0d7" font-weight="400">证据不足或相互冲突</text><text x="450" y="693" font-size="20" fill="#afc0d7" font-weight="400">保留，但不进入 MCP 召回</text><rect x="820" y="590" width="340" height="150" rx="10" fill="#3b2429" stroke="#ef9b99" stroke-width="1.5" /><text x="840" y="627" font-size="24" fill="#edf3ff" font-weight="650">拒绝 · rejected</text><text x="840" y="662" font-size="21" fill="#afc0d7" font-weight="400">有反证，无硬证据</text><text x="840" y="693" font-size="21" fill="#afc0d7" font-weight="400">退役并记录原因</text><path d="M210 741 V795" fill="none" stroke="#7dc9b0" stroke-width="2.5" marker-end="url(#yes)" stroke-linejoin="round"/><path d="M600 741 V795" fill="none" stroke="#e2b65e" stroke-width="2.5" marker-end="url(#hold)" stroke-linejoin="round"/><path d="M990 741 V795" fill="none" stroke="#ef9b99" stroke-width="2.5" marker-end="url(#no)" stroke-linejoin="round"/><rect x="40" y="800" width="340" height="200" rx="10" fill="#18263a" stroke="#3b4d65" stroke-width="1.5" /><text x="60" y="837" font-size="23" fill="#edf3ff" font-weight="650">作用域召回 · recall</text><text x="60" y="872" font-size="20" fill="#afc0d7" font-weight="400">仓库 + 版本 + 状态过滤</text><text x="60" y="903" font-size="20" fill="#afc0d7" font-weight="400">任务相关性排序</text><text x="60" y="934" font-size="20" fill="#afc0d7" font-weight="400">附来源、使用记录与警告</text><rect x="430" y="800" width="340" height="200" rx="10" fill="#372f1e" stroke="#e2b65e" stroke-width="1.5" stroke-dasharray="7 5"/><text x="450" y="837" font-size="22" fill="#edf3ff" font-weight="650">人工 CLI · 非 MCP 工具</text><text x="450" y="872" font-size="19" fill="#afc0d7" font-weight="400">登记审批人：批准 / 拒绝</text><text x="450" y="903" font-size="19" fill="#afc0d7" font-weight="400">批准 → 可召回；拒绝 → 退役</text><text x="450" y="934" font-size="19" fill="#afc0d7" font-weight="400">可主动撤回已生效经验</text><rect x="820" y="800" width="340" height="200" rx="10" fill="#18263a" stroke="#3b4d65" stroke-width="1.5" /><text x="840" y="837" font-size="24" fill="#edf3ff" font-weight="650">事件历史</text><text x="840" y="872" font-size="21" fill="#afc0d7" font-weight="400">经验与决策记录保留</text><text x="840" y="903" font-size="21" fill="#afc0d7" font-weight="400">退役后不再召回</text><text x="840" y="934" font-size="21" fill="#afc0d7" font-weight="400">记录原因，不直接删除</text><path d="M428 875 H385" fill="none" stroke="#7dc9b0" stroke-width="2.5" marker-end="url(#yes)" stroke-linejoin="round"/><path d="M772 915 H815" fill="none" stroke="#ef9b99" stroke-width="2.5" marker-end="url(#no)" stroke-linejoin="round"/><path d="M210 1001 V1065" fill="none" stroke="#9dbdff" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><rect x="40" y="1070" width="730" height="175" rx="10" fill="#18263a" stroke="#3b4d65" stroke-width="1.5" /><text x="60" y="1107" font-size="23" fill="#edf3ff" font-weight="650">任务结果反馈 · report_outcome</text><text x="60" y="1142" font-size="20" fill="#afc0d7" font-weight="400">引用且通过 → 成功使用记录；可清除 suspect</text><text x="60" y="1173" font-size="20" fill="#afc0d7" font-weight="400">相关评审失败：首次 suspect，再次 retired</text><text x="60" y="1204" font-size="20" fill="#afc0d7" font-weight="400">无关失败不归责；关联判断是启发式，不是因果证明</text><path d="M40 1155 H18 V912 H36" fill="none" stroke="#9dbdff" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><path d="M772 1155 H990 V1005" fill="none" stroke="#ef9b99" stroke-width="2.5" marker-end="url(#no)" stroke-linejoin="round"/><text x="855" y="1138" font-size="18" fill="#ef9b99" font-weight="500">退役</text><text x="820" y="1206" font-size="18" fill="#afc0d7" font-weight="400">反馈更新状态与使用记录</text><rect x="40" y="1300" width="1120" height="135" rx="10" fill="#111b2b" stroke="#3b4d65" stroke-width="1.5" stroke-dasharray="7 5"/><text x="60" y="1337" font-size="24" fill="#edf3ff" font-weight="600">实验扩展 · 不属于默认 MCP 配置</text><text x="60" y="1380" font-size="22" fill="#afc0d7" font-weight="400">反事实验证 · 分层注入 · 动态遗忘 · 长会话上下文管理；均有独立实验与局限</text><text x="60" y="1413" font-size="20" fill="#afc0d7" font-weight="400">此图展示当前默认 MCP 路径；完整共享网关逻辑与库接口见下文</text></g></svg>