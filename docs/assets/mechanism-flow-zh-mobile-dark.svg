<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1950" viewBox="0 0 720 1950" role="img" aria-labelledby="title desc"><title id="title">Attest 默认 MCP 核心机制</title><desc id="desc">证据采集与验证、三态网关、作用域召回、任务反馈和独立人工治理。实验扩展单独标注。</desc><defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9dbdff"/></marker><marker id="yes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dc9b0"/></marker><marker id="hold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b65e"/></marker><marker id="no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef9b99"/></marker></defs><g font-family="Segoe UI, Arial, Microsoft YaHei, sans-serif"><rect width="720" height="1950" rx="14" fill="#111b2b"/><text x="40" y="53" font-size="34" fill="#edf3ff" font-weight="700">Attest 核心机制</text><text x="40" y="89" font-size="21" fill="#afc0d7" font-weight="400">默认 MCP 路径：以证据准入，以状态控制召回</text><rect x="40" y="130" width="640" height="140" rx="10" fill="#18263a" stroke="#3b4d65" stroke-width="1.5" /><text x="60" y="167" font-size="26" fill="#edf3ff" font-weight="650">1. 来源与验证</text><text x="60" y="202" font-size="23" fill="#afc0d7" font-weight="400">原始评审 + 服务端 Git diff</text><text x="60" y="233" font-size="23" fill="#afc0d7" font-weight="400">配置者指定验证命令；失败则不学习</text><path d="M360 271 V305" fill="none" stroke="#9dbdff" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><rect x="40" y="310" width="640" height="140" rx="10" fill="#18263a" stroke="#3b4d65" stroke-width="1.5" /><text x="60" y="347" font-size="27" fill="#edf3ff" font-weight="650">2. 提出候选经验</text><text x="60" y="382" font-size="24" fill="#afc0d7" font-weight="400">最多 3 条，每条引用评审原文</text><text x="60" y="413" font-size="24" fill="#afc0d7" font-weight="400">并指向实际新增代码行</text><path d="M360 451 V485" fill="none" stroke="#9dbdff" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><rect x="40" y="490" width="640" height="205" rx="10" fill="#18263a" stroke="#3b4d65" stroke-width="1.5" /><text x="60" y="527" font-size="26" fill="#edf3ff" font-weight="650">3. 确定性证据网关</text><text x="60" y="562" font-size="23" fill="#afc0d7" font-weight="400">反证：违背团队代码检查</text><text x="60" y="593" font-size="23" fill="#afc0d7" font-weight="400">硬证据：已登记政策 / 支持性代码检查</text><text x="60" y="624" font-size="23" fill="#afc0d7" font-weight="400">软证据：可信评审措辞，单独不足</text><path d="M360 696 V735" fill="none" stroke="#9dbdff" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><rect x="40" y="740" width="640" height="110" rx="10" fill="#18352f" stroke="#7dc9b0" stroke-width="1.5" /><text x="60" y="777" font-size="26" fill="#edf3ff" font-weight="650">批准：无反证 + 硬证据</text><text x="60" y="812" font-size="23" fill="#afc0d7" font-weight="400">可作为规则参与后续召回</text><rect x="40" y="870" width="640" height="110" rx="10" fill="#372f1e" stroke="#e2b65e" stroke-width="1.5" /><text x="60" y="907" font-size="25" fill="#edf3ff" font-weight="650">待人工：证据不足或冲突</text><text x="60" y="942" font-size="22" fill="#afc0d7" font-weight="400">保留为待定笔记，MCP 不召回</text><rect x="40" y="1000" width="640" height="110" rx="10" fill="#3b2429" stroke="#ef9b99" stroke-width="1.5" /><text x="60" y="1037" font-size="26" fill="#edf3ff" font-weight="650">拒绝：有反证，无硬证据</text><text x="60" y="1072" font-size="23" fill="#afc0d7" font-weight="400">退役并保留原因，不再召回</text><text x="42" y="1157" font-size="22" fill="#9dbdff" font-weight="500">只有符合准入与状态要求的经验才能进入召回</text><rect x="40" y="1185" width="640" height="155" rx="10" fill="#18263a" stroke="#3b4d65" stroke-width="1.5" /><text x="60" y="1222" font-size="25" fill="#edf3ff" font-weight="650">4. 作用域召回</text><text x="60" y="1257" font-size="22" fill="#afc0d7" font-weight="400">仓库 + 版本 + 状态过滤，按任务相关性排序</text><text x="60" y="1288" font-size="22" fill="#afc0d7" font-weight="400">附来源、使用历史；suspect 带警告</text><path d="M360 1341 V1370" fill="none" stroke="#9dbdff" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><rect x="40" y="1375" width="640" height="155" rx="10" fill="#18263a" stroke="#3b4d65" stroke-width="1.5" /><text x="60" y="1412" font-size="24" fill="#edf3ff" font-weight="650">5. 结果反馈，更新状态</text><text x="60" y="1447" font-size="21" fill="#afc0d7" font-weight="400">引用且通过 → 成功记录；可清除 suspect</text><text x="60" y="1478" font-size="21" fill="#afc0d7" font-weight="400">相关失败：suspect → retired；无关失败不归责</text><rect x="40" y="1560" width="640" height="150" rx="10" fill="#372f1e" stroke="#e2b65e" stroke-width="1.5" stroke-dasharray="7 5"/><text x="60" y="1597" font-size="24" fill="#edf3ff" font-weight="650">人工治理边界 · CLI，不通过 MCP</text><text x="60" y="1632" font-size="21" fill="#afc0d7" font-weight="400">待定经验可批准 / 拒绝；已生效经验可撤回</text><text x="60" y="1663" font-size="21" fill="#afc0d7" font-weight="400">批准后可召回；拒绝或撤回后退役，历史保留</text><rect x="40" y="1760" width="640" height="135" rx="10" fill="#111b2b" stroke="#3b4d65" stroke-width="1.5" stroke-dasharray="7 5"/><text x="60" y="1797" font-size="24" fill="#edf3ff" font-weight="600">实验扩展 · 不属于默认 MCP 配置</text><text x="60" y="1835" font-size="21" fill="#afc0d7" font-weight="400">反事实验证 / 分层注入 / 动态遗忘 / 上下文管理</text><text x="60" y="1869" font-size="20" fill="#afc0d7" font-weight="400">各自单独评估；完整边界与代码见下文</text></g></svg>