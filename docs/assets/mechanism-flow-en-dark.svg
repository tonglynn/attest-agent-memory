<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1460" viewBox="0 0 1200 1460" role="img" aria-labelledby="title desc"><title id="title">Attest default MCP core mechanisms</title><desc id="desc">Source verification, three-state admission, scoped recall, task feedback, and separate human governance. Experimental extensions are marked separately.</desc><defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9dbdff"/></marker><marker id="yes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dc9b0"/></marker><marker id="hold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b65e"/></marker><marker id="no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef9b99"/></marker></defs><g font-family="Segoe UI, Arial, Microsoft YaHei, sans-serif"><rect width="1200" height="1460" rx="14" fill="#111b2b"/><text x="40" y="53" font-size="34" fill="#edf3ff" font-weight="700">Attest core mechanisms</text><text x="40" y="89" font-size="21" fill="#afc0d7" font-weight="400">Default MCP path: evidence-based admission, state-aware recall</text><rect x="40" y="130" width="340" height="175" rx="10" fill="#18263a" stroke="#3b4d65" stroke-width="1.5" /><text x="60" y="167" font-size="25" fill="#edf3ff" font-weight="650">Capture the source</text><text x="60" y="202" font-size="22" fill="#afc0d7" font-weight="400">Original review comments</text><text x="60" y="233" font-size="22" fill="#afc0d7" font-weight="400">Server-computed Git diff</text><rect x="430" y="130" width="340" height="175" rx="10" fill="#18263a" stroke="#3b4d65" stroke-width="1.5" /><text x="450" y="167" font-size="25" fill="#edf3ff" font-weight="650">Run verification</text><text x="450" y="202" font-size="22" fill="#afc0d7" font-weight="400">Operator-configured command</text><text x="450" y="233" font-size="22" fill="#afc0d7" font-weight="400">Failure → no default learning</text><rect x="820" y="130" width="340" height="175" rx="10" fill="#18263a" stroke="#3b4d65" stroke-width="1.5" /><text x="840" y="167" font-size="25" fill="#edf3ff" font-weight="650">Propose candidate notes</text><text x="840" y="202" font-size="22" fill="#afc0d7" font-weight="400">At most 3; review quotation</text><text x="840" y="233" font-size="22" fill="#afc0d7" font-weight="400">+ an actual added code line</text><path d="M382 217 H425" fill="none" stroke="#9dbdff" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><path d="M772 217 H815" fill="none" stroke="#9dbdff" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><path d="M990 306 V347" fill="none" stroke="#9dbdff" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><rect x="40" y="350" width="1120" height="175" rx="10" fill="#18263a" stroke="#3b4d65" stroke-width="1.5" /><text x="60" y="387" font-size="28" fill="#edf3ff" font-weight="650">Deterministic evidence gateway</text><text x="62" y="437" font-size="24" fill="#9dbdff" font-weight="600">Counter-evidence</text><text x="62" y="477" font-size="21" fill="#afc0d7" font-weight="400">Violating team code checks</text><text x="430" y="437" font-size="24" fill="#9dbdff" font-weight="600">Hard evidence</text><text x="430" y="477" font-size="21" fill="#afc0d7" font-weight="400">Registered policy / code checks</text><text x="820" y="437" font-size="24" fill="#9dbdff" font-weight="600">Soft evidence</text><text x="820" y="477" font-size="21" fill="#afc0d7" font-weight="400">Trusted wording is insufficient</text><path d="M600 526 V554 H210 V585" fill="none" stroke="#9dbdff" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><path d="M600 554 V585" fill="none" stroke="#9dbdff" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><path d="M600 554 H990 V585" fill="none" stroke="#9dbdff" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><rect x="40" y="590" width="340" height="150" rx="10" fill="#18352f" stroke="#7dc9b0" stroke-width="1.5" /><text x="60" y="627" font-size="24" fill="#edf3ff" font-weight="650">Approved</text><text x="60" y="662" font-size="21" fill="#afc0d7" font-weight="400">No counter + hard support</text><text x="60" y="693" font-size="21" fill="#afc0d7" font-weight="400">Eligible to become a rule</text><rect x="430" y="590" width="340" height="150" rx="10" fill="#372f1e" stroke="#e2b65e" stroke-width="1.5" /><text x="450" y="627" font-size="23" fill="#edf3ff" font-weight="650">Uncertain</text><text x="450" y="662" font-size="20" fill="#afc0d7" font-weight="400">Insufficient / conflicting</text><text x="450" y="693" font-size="20" fill="#afc0d7" font-weight="400">Held; not recalled over MCP</text><rect x="820" y="590" width="340" height="150" rx="10" fill="#3b2429" stroke="#ef9b99" stroke-width="1.5" /><text x="840" y="627" font-size="24" fill="#edf3ff" font-weight="650">Rejected</text><text x="840" y="662" font-size="21" fill="#afc0d7" font-weight="400">Counter without hard support</text><text x="840" y="693" font-size="21" fill="#afc0d7" font-weight="400">Retire and record the reason</text><path d="M210 741 V795" fill="none" stroke="#7dc9b0" stroke-width="2.5" marker-end="url(#yes)" stroke-linejoin="round"/><path d="M600 741 V795" fill="none" stroke="#e2b65e" stroke-width="2.5" marker-end="url(#hold)" stroke-linejoin="round"/><path d="M990 741 V795" fill="none" stroke="#ef9b99" stroke-width="2.5" marker-end="url(#no)" stroke-linejoin="round"/><rect x="40" y="800" width="340" height="200" rx="10" fill="#18263a" stroke="#3b4d65" stroke-width="1.5" /><text x="60" y="837" font-size="23" fill="#edf3ff" font-weight="650">Scoped recall</text><text x="60" y="872" font-size="20" fill="#afc0d7" font-weight="400">Filter repository / version / status</text><text x="60" y="903" font-size="20" fill="#afc0d7" font-weight="400">Rank by task relevance</text><text x="60" y="934" font-size="20" fill="#afc0d7" font-weight="400">Include provenance, use, warnings</text><rect x="430" y="800" width="340" height="200" rx="10" fill="#372f1e" stroke="#e2b65e" stroke-width="1.5" stroke-dasharray="7 5"/><text x="450" y="837" font-size="22" fill="#edf3ff" font-weight="650">Human CLI · outside MCP</text><text x="450" y="872" font-size="19" fill="#afc0d7" font-weight="400">Registered approval / rejection</text><text x="450" y="903" font-size="19" fill="#afc0d7" font-weight="400">Approve → recall; reject → retire</text><text x="450" y="934" font-size="19" fill="#afc0d7" font-weight="400">Can retract an active note</text><rect x="820" y="800" width="340" height="200" rx="10" fill="#18263a" stroke="#3b4d65" stroke-width="1.5" /><text x="840" y="837" font-size="24" fill="#edf3ff" font-weight="650">Event history</text><text x="840" y="872" font-size="21" fill="#afc0d7" font-weight="400">Notes and decisions retained</text><text x="840" y="903" font-size="21" fill="#afc0d7" font-weight="400">Retired notes are not recalled</text><text x="840" y="934" font-size="21" fill="#afc0d7" font-weight="400">Record reasons, do not erase</text><path d="M428 875 H385" fill="none" stroke="#7dc9b0" stroke-width="2.5" marker-end="url(#yes)" stroke-linejoin="round"/><path d="M772 915 H815" fill="none" stroke="#ef9b99" stroke-width="2.5" marker-end="url(#no)" stroke-linejoin="round"/><path d="M210 1001 V1065" fill="none" stroke="#9dbdff" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><rect x="40" y="1070" width="730" height="175" rx="10" fill="#18263a" stroke="#3b4d65" stroke-width="1.5" /><text x="60" y="1107" font-size="23" fill="#edf3ff" font-weight="650">Task-outcome feedback · report_outcome</text><text x="60" y="1142" font-size="20" fill="#afc0d7" font-weight="400">Cited + passed → successful use; can clear suspect</text><text x="60" y="1173" font-size="20" fill="#afc0d7" font-weight="400">Related review failure: suspect, then retired</text><text x="60" y="1204" font-size="20" fill="#afc0d7" font-weight="400">Unrelated failures are not blamed; relatedness is heuristic</text><path d="M40 1155 H18 V912 H36" fill="none" stroke="#9dbdff" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><path d="M772 1155 H990 V1005" fill="none" stroke="#ef9b99" stroke-width="2.5" marker-end="url(#no)" stroke-linejoin="round"/><text x="855" y="1138" font-size="18" fill="#ef9b99" font-weight="500">retire</text><text x="820" y="1206" font-size="18" fill="#afc0d7" font-weight="400">Feedback updates state and use</text><rect x="40" y="1300" width="1120" height="135" rx="10" fill="#111b2b" stroke="#3b4d65" stroke-width="1.5" stroke-dasharray="7 5"/><text x="60" y="1337" font-size="24" fill="#edf3ff" font-weight="600">Experimental extensions · not the default MCP configuration</text><text x="60" y="1380" font-size="22" fill="#afc0d7" font-weight="400">Counterfactual validation · Tiered injection · Dynamic forgetting · Long-session context management</text><text x="60" y="1413" font-size="20" fill="#afc0d7" font-weight="400">This diagram shows the default MCP path; shared gateway logic and library operations are explained below.</text></g></svg>