<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1950" viewBox="0 0 720 1950" role="img" aria-labelledby="title desc"><title id="title">Attest default MCP core mechanisms</title><desc id="desc">Source verification, three-state admission, scoped recall, task feedback, and separate human governance. Experimental extensions are marked separately.</desc><defs><marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3768b5"/></marker><marker id="yes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#267b61"/></marker><marker id="hold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a6b15"/></marker><marker id="no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a64d51"/></marker></defs><g font-family="Segoe UI, Arial, Microsoft YaHei, sans-serif"><rect width="720" height="1950" rx="14" fill="#ffffff"/><text x="40" y="53" font-size="34" fill="#20334e" font-weight="700">Attest core mechanisms</text><text x="40" y="89" font-size="21" fill="#52657f" font-weight="400">Default MCP path: evidence-based admission, state-aware recall</text><rect x="40" y="130" width="640" height="140" rx="10" fill="#f7f9fc" stroke="#ccd8e8" stroke-width="1.5" /><text x="60" y="167" font-size="26" fill="#20334e" font-weight="650">1. Source and verification</text><text x="60" y="202" font-size="23" fill="#52657f" font-weight="400">Original review + server Git diff</text><text x="60" y="233" font-size="23" fill="#52657f" font-weight="400">Operator configures verification; failure stops learning</text><path d="M360 271 V305" fill="none" stroke="#3768b5" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><rect x="40" y="310" width="640" height="140" rx="10" fill="#f7f9fc" stroke="#ccd8e8" stroke-width="1.5" /><text x="60" y="347" font-size="27" fill="#20334e" font-weight="650">2. Propose candidate notes</text><text x="60" y="382" font-size="24" fill="#52657f" font-weight="400">At most 3 notes, each quoting the review</text><text x="60" y="413" font-size="24" fill="#52657f" font-weight="400">and an actual added code line</text><path d="M360 451 V485" fill="none" stroke="#3768b5" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><rect x="40" y="490" width="640" height="205" rx="10" fill="#f7f9fc" stroke="#ccd8e8" stroke-width="1.5" /><text x="60" y="527" font-size="26" fill="#20334e" font-weight="650">3. Deterministic evidence gateway</text><text x="60" y="562" font-size="23" fill="#52657f" font-weight="400">Counter: violating a team code check</text><text x="60" y="593" font-size="23" fill="#52657f" font-weight="400">Hard: registered policy / supporting code check</text><text x="60" y="624" font-size="23" fill="#52657f" font-weight="400">Soft: trusted wording, insufficient on its own</text><path d="M360 696 V735" fill="none" stroke="#3768b5" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><rect x="40" y="740" width="640" height="110" rx="10" fill="#eef7f2" stroke="#267b61" stroke-width="1.5" /><text x="60" y="777" font-size="26" fill="#20334e" font-weight="650">Approved: no counter + hard support</text><text x="60" y="812" font-size="23" fill="#52657f" font-weight="400">Eligible for subsequent recall</text><rect x="40" y="870" width="640" height="110" rx="10" fill="#fff8e9" stroke="#9a6b15" stroke-width="1.5" /><text x="60" y="907" font-size="25" fill="#20334e" font-weight="650">Uncertain: insufficient / conflicting evidence</text><text x="60" y="942" font-size="22" fill="#52657f" font-weight="400">Retained, but excluded from MCP recall</text><rect x="40" y="1000" width="640" height="110" rx="10" fill="#fcf0f0" stroke="#a64d51" stroke-width="1.5" /><text x="60" y="1037" font-size="26" fill="#20334e" font-weight="650">Rejected: counter, no hard support</text><text x="60" y="1072" font-size="23" fill="#52657f" font-weight="400">Retire with a reason; excluded from recall</text><text x="42" y="1157" font-size="22" fill="#3768b5" font-weight="500">Only eligible notes proceed to recall</text><rect x="40" y="1185" width="640" height="155" rx="10" fill="#f7f9fc" stroke="#ccd8e8" stroke-width="1.5" /><text x="60" y="1222" font-size="25" fill="#20334e" font-weight="650">4. Scoped recall</text><text x="60" y="1257" font-size="22" fill="#52657f" font-weight="400">Filter repo / version / status; rank by relevance</text><text x="60" y="1288" font-size="22" fill="#52657f" font-weight="400">Include provenance and use; suspect carries a warning</text><path d="M360 1341 V1370" fill="none" stroke="#3768b5" stroke-width="2.5" marker-end="url(#flow)" stroke-linejoin="round"/><rect x="40" y="1375" width="640" height="155" rx="10" fill="#f7f9fc" stroke="#ccd8e8" stroke-width="1.5" /><text x="60" y="1412" font-size="24" fill="#20334e" font-weight="650">5. Feedback updates note state</text><text x="60" y="1447" font-size="21" fill="#52657f" font-weight="400">Cited + passed → successful use; can clear suspect</text><text x="60" y="1478" font-size="21" fill="#52657f" font-weight="400">Related failures: suspect → retired; no unrelated blame</text><rect x="40" y="1560" width="640" height="150" rx="10" fill="#fff8e9" stroke="#9a6b15" stroke-width="1.5" stroke-dasharray="7 5"/><text x="60" y="1597" font-size="24" fill="#20334e" font-weight="650">Human governance · CLI, not MCP</text><text x="60" y="1632" font-size="21" fill="#52657f" font-weight="400">Approve / reject held notes; retract active notes</text><text x="60" y="1663" font-size="21" fill="#52657f" font-weight="400">Approval enables recall; retirement preserves history</text><rect x="40" y="1760" width="640" height="135" rx="10" fill="#ffffff" stroke="#ccd8e8" stroke-width="1.5" stroke-dasharray="7 5"/><text x="60" y="1797" font-size="24" fill="#20334e" font-weight="600">Experimental extensions · separate from MCP</text><text x="60" y="1835" font-size="21" fill="#52657f" font-weight="400">Counterfactual checks / tiers / forgetting / context</text><text x="60" y="1869" font-size="20" fill="#52657f" font-weight="400">Separately evaluated; implementation details below</text></g></svg>