<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Attest architecture: write path, team memory, recall path and human governance</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="419" rx="14" fill="#ffffff" stroke="#dde2da"/>

  <!-- lane labels -->
  <g>
    <rect x="24" y="28" width="5" height="92" fill="#2a78d6"/>
    <text x="40" y="58" font-size="17" font-weight="700" fill="#17201a">Write path</text>
    <text x="40" y="80" font-size="13" fill="#1c5cab" font-family="ui-monospace, Menlo, Consolas, monospace">learn</text>
    <text x="40" y="102" font-size="12.5" fill="#6f7a72">after a verified task</text>

    <rect x="24" y="290" width="5" height="92" fill="#2a78d6"/>
    <text x="40" y="320" font-size="17" font-weight="700" fill="#17201a">Recall path</text>
    <text x="40" y="342" font-size="13" fill="#1c5cab" font-family="ui-monospace, Menlo, Consolas, monospace">recall</text>
    <text x="40" y="364" font-size="12.5" fill="#6f7a72">before a new task</text>
  </g>

  <!-- write lane -->
  <g font-size="12.5" fill="#4c5850">
    <rect x="170" y="28" width="172" height="92" rx="10" fill="#f6f7f4" stroke="#dde2da"/>
    <text x="184" y="54" font-size="15" font-weight="700" fill="#17201a">1  Verify</text>
    <text x="184" y="78">Attest runs the tests</text>
    <text x="184" y="96">itself; failed tasks</text>
    <text x="184" y="114">teach nothing</text>

    <rect x="364" y="28" width="172" height="92" rx="10" fill="#f6f7f4" stroke="#dde2da"/>
    <text x="378" y="54" font-size="15" font-weight="700" fill="#17201a">2  Propose</text>
    <text x="378" y="78">≤ 3 candidates, each</text>
    <text x="378" y="96">quoting the review and</text>
    <text x="378" y="114">the changed line</text>

    <rect x="558" y="28" width="172" height="92" rx="10" fill="#e7f0fb" stroke="#2a78d6"/>
    <text x="572" y="54" font-size="15" font-weight="700" fill="#17201a">3  Gate</text>
    <text x="572" y="78">deterministic checks,</text>
    <text x="572" y="96">evidence classes →</text>
    <text x="572" y="114" font-weight="700" fill="#1c5cab">approve · reject · hold</text>

    <rect x="752" y="28" width="184" height="92" rx="10" fill="#f6f7f4" stroke="#dde2da"/>
    <text x="766" y="54" font-size="15" font-weight="700" fill="#17201a">4  Merge</text>
    <text x="766" y="78">deduplicate, supersede</text>
    <text x="766" y="96">or correct existing</text>
    <text x="766" y="114">notes</text>
  </g>
  <g stroke="#2a78d6" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="344" y1="74" x2="360" y2="74"/>
    <line x1="538" y1="74" x2="554" y2="74"/>
    <line x1="732" y1="74" x2="748" y2="74"/>
  </g>

  <!-- memory + governance -->
  <rect x="170" y="166" width="530" height="78" rx="10" fill="#e7f0fb" stroke="#2a78d6"/>
  <text x="188" y="196" font-size="15" font-weight="700" fill="#17201a">Team memory</text>
  <text x="188" y="219" font-size="12.5" fill="#4c5850">notes scoped to repository and version range, with provenance;</text>
  <text x="188" y="237" font-size="12.5" fill="#4c5850">append-only, HMAC-sealed event log</text>

  <rect x="740" y="166" width="196" height="78" rx="10" fill="#fff8e6" stroke="#c98a12"/>
  <text x="754" y="192" font-size="15" font-weight="700" fill="#17201a">People only</text>
  <text x="754" y="214" font-size="12.5" fill="#4c5850">approve · reject · retract</text>
  <text x="754" y="234" font-size="12" fill="#6f7a72" font-family="ui-monospace, Menlo, Consolas, monospace">attest-admin, not MCP</text>
  <line x1="738" y1="205" x2="704" y2="205" stroke="#c98a12" stroke-width="2" marker-end="url(#a)"/>

  <g stroke="#2a78d6" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M 844 122 L 844 144 L 600 144 L 600 162"/>
    <line x1="256" y1="246" x2="256" y2="286"/>
    <path d="M 844 290 L 844 266 L 640 266 L 640 248"/>
  </g>
  <text x="852" y="140" font-size="12" fill="#1c5cab">stores</text>
  <text x="266" y="272" font-size="12" fill="#1c5cab">reads</text>
  <text x="852" y="282" font-size="12" fill="#1c5cab">outcome</text>

  <!-- recall lane -->
  <g font-size="12.5" fill="#4c5850">
    <rect x="170" y="290" width="172" height="92" rx="10" fill="#f6f7f4" stroke="#dde2da"/>
    <text x="184" y="316" font-size="15" font-weight="700" fill="#17201a">1  Filter</text>
    <text x="184" y="340">this repository, this</text>
    <text x="184" y="358">version, approved notes</text>
    <text x="184" y="376">only</text>

    <rect x="364" y="290" width="172" height="92" rx="10" fill="#f6f7f4" stroke="#dde2da"/>
    <text x="378" y="316" font-size="15" font-weight="700" fill="#17201a">2  Rank</text>
    <text x="378" y="340">relevance to the task;</text>
    <text x="378" y="358">core rules first, soft</text>
    <text x="378" y="376">token budget</text>

    <rect x="558" y="290" width="172" height="92" rx="10" fill="#f6f7f4" stroke="#dde2da"/>
    <text x="572" y="316" font-size="15" font-weight="700" fill="#17201a">3  Inject</text>
    <text x="572" y="340">each note with source,</text>
    <text x="572" y="358">version and use record</text>

    <rect x="752" y="290" width="184" height="92" rx="10" fill="#f6f7f4" stroke="#dde2da"/>
    <text x="766" y="316" font-size="15" font-weight="700" fill="#17201a">4  Feed back</text>
    <text x="766" y="340">verified → stronger</text>
    <text x="766" y="358">failed → suspect →</text>
    <text x="766" y="376">retired</text>
  </g>
  <g stroke="#2a78d6" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="344" y1="336" x2="360" y2="336"/>
    <line x1="538" y1="336" x2="554" y2="336"/>
    <line x1="732" y1="336" x2="748" y2="336"/>
  </g>
</svg>
